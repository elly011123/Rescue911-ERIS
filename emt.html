<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMT Dashboard - ERIS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="events.js"></script>
    <style>
        .dashboard {
            min-height: 100vh;
            background: var(--color-bg-secondary);
        }
        
        .dashboard-header {
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-lg) var(--space-xl);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }
        
        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--color-success) 0%, #2F855A 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 0.25rem;
        }
        
        .header-text p {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--color-success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .user-details {
            display: flex;
            flex-direction: column;
        }
        
        .user-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }
        
        .user-role {
            font-size: 0.75rem;
            color: var(--color-text-tertiary);
        }
        
        .btn-logout {
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-logout:hover {
            background: var(--color-bg);
            color: var(--color-text-primary);
            border-color: var(--color-border-dark);
        }
        
        .dashboard-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-xl);
        }
        
        .status-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-bottom: var(--space-xl);
            box-shadow: var(--shadow-md);
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--space-lg);
        }
        
        .status-display {
            background: var(--color-bg-secondary);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            text-align: center;
            margin-bottom: var(--space-lg);
        }
        
        .status-label {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .status-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: var(--space-sm);
        }
        
        .status-value.available {
            color: var(--color-success);
        }
        
        .status-value.on-scene {
            color: #8b5cf6;
        }
        
        .status-value.transporting {
            color: var(--color-info);
        }
        
        .status-value.off-duty {
            color: var(--color-text-tertiary);
        }
        
        .status-timestamp {
            font-size: 0.8rem;
            color: var(--color-text-tertiary);
            font-family: var(--font-mono);
        }
        
        .status-controls {
            display: grid;
            gap: var(--space-md);
        }
        
        .form-field {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        
        .select-wrapper {
            position: relative;
        }
        
        .field-select {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 0.95rem;
            color: var(--color-text-primary);
            background: var(--color-bg);
            transition: all var(--transition-fast);
            outline: none;
            appearance: none;
            cursor: pointer;
            padding-right: 2.5rem;
        }
        
        .field-select:focus {
            border-color: var(--color-success);
            box-shadow: 0 0 0 3px rgba(47, 133, 90, 0.1);
        }
        
        .select-arrow {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--color-text-tertiary);
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }
        
        .action-btn {
            background: var(--color-bg);
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: center;
        }
        
        .action-btn:hover {
            background: var(--color-bg-tertiary);
            border-color: var(--color-success);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .action-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--color-success) 0%, #2F855A 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .action-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-xl);
        }
        
        .card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-sm);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--color-border);
        }
        
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }
        
        .activity-item {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-success);
            border-radius: var(--radius-md);
            padding: var(--space-md);
        }
        
        .activity-time {
            font-size: 0.8rem;
            color: var(--color-text-tertiary);
            font-family: var(--font-mono);
            margin-bottom: var(--space-xs);
        }
        
        .activity-text {
            font-size: 0.95rem;
            color: var(--color-text-primary);
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .dashboard-content {
                padding: var(--space-md);
            }
            
            .header-content {
                flex-direction: column;
                gap: var(--space-md);
            }
            
            .quick-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <div class="header-content">
                <div class="header-title">
                    <div class="header-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <polyline points="17 11 19 13 23 9"/>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>EMT / Paramedic Dashboard</h1>
                        <p id="currentTime">Loading...</p>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">EMT</div>
                        <div class="user-details">
                            <div class="user-name" id="userName">EMT</div>
                            <div class="user-role">Emergency Medical Technician</div>
                        </div>
                    </div>
                    <a href="clock_system.html" class="header-icon-btn" title="Time Clock" aria-label="Time Clock">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </a>
                    <button class="btn-logout" onclick="logout()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 4px;">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </header>
        
        <main class="dashboard-content">
            <div class="status-card">
                <h2 class="card-title">Current Status</h2>
                <div class="status-display">
                    <div class="status-label">Current Status</div>
                    <div class="status-value available" id="currentStatus">Available</div>
                    <div class="status-timestamp" id="statusTimestamp">Last updated: --:--</div>
                </div>
                <div class="status-controls">
                    <div class="form-field">
                        <label for="statusSelect" class="field-label">Update Status</label>
                        <div class="select-wrapper">
                            <select id="statusSelect" class="field-select" onchange="updateStatus()">
                                <option value="available">Available</option>
                                <option value="en-route">En Route</option>
                                <option value="on-scene">On Scene</option>
                                <option value="transporting">Transporting</option>
                                <option value="off-duty">Off Duty</option>
                            </select>
                            <svg class="select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="locationInput" class="field-label">Current Location (Optional)</label>
                        <input 
                            type="text" 
                            id="locationInput" 
                            class="field-input"
                            placeholder="Enter location or address"
                        >
                    </div>
                </div>
            </div>
            
            <div class="quick-actions">
                <div class="action-btn" onclick="reportArrival()">
                    <div class="action-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                    </div>
                    <div class="action-label">Report Arrival</div>
                </div>
                <div class="action-btn" onclick="reportDeparture()">
                    <div class="action-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                    </div>
                    <div class="action-label">Report Departure</div>
                </div>
                <div class="action-btn" onclick="requestBackup()">
                    <div class="action-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <div class="action-label">Request Backup</div>
                </div>
            </div>
            
            <div class="main-grid">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Recent Activity</h2>
                    </div>
                    <div class="activity-list" id="activityList">
                        <div class="activity-item">
                            <div class="activity-time">--:--:--</div>
                            <div class="activity-text">System initialized</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // Current user and unit ID
        const currentUser = JSON.parse(localStorage.getItem('r911.currentUser') || '{}');
        const unitId = currentUser.employeeId || 'EMT-001';
        
        // Update current time
        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        updateCurrentTime();
        setInterval(updateCurrentTime, 30000);
        
        // Load user info
        if (currentUser.name) {
            document.getElementById('userName').textContent = currentUser.name;
            const initials = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase();
            document.getElementById('userAvatar').textContent = initials;
        }
        
        // Logout
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('r911.currentUser');
                localStorage.removeItem('username');
                window.location.href = 'index.html';
            }
        }
        
        // Update status
        function updateStatus() {
            const status = document.getElementById('statusSelect').value;
            const location = document.getElementById('locationInput').value.trim();
            
            const statusEl = document.getElementById('currentStatus');
            statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1).replace('-', ' ');
            statusEl.className = 'status-value ' + status;
            
            const now = new Date();
            document.getElementById('statusTimestamp').textContent = 
                `Last updated: ${now.toLocaleTimeString()}`;
            
            // Update EMT units in storage
            updateEMTUnit(status, location);
            
            // Add activity
            addActivity(`Status changed to ${status.replace('-', ' ')}`);
            
            if (typeof ERIS !== 'undefined') {
                ERIS.toast(`Status updated to ${status.replace('-', ' ')}`);
            }
        }
        
        // Update EMT unit in storage
        function updateEMTUnit(status, location) {
            try {
                const stored = localStorage.getItem('emt-units');
                let units = stored ? JSON.parse(stored) : [];
                
                const unitIndex = units.findIndex(u => u.id === unitId);
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            const unitData = {
                                id: unitId,
                                name: currentUser.name || unitId,
                                status: status,
                                lat: position.coords.latitude,
                                lng: position.coords.longitude,
                                location: location || 'Current location',
                                lastUpdate: new Date().toISOString()
                            };
                            
                            if (unitIndex >= 0) {
                                units[unitIndex] = unitData;
                            } else {
                                units.push(unitData);
                            }
                            
                            localStorage.setItem('emt-units', JSON.stringify(units));
                        },
                        function(error) {
                            // Update without coordinates
                            const unitData = {
                                id: unitId,
                                name: currentUser.name || unitId,
                                status: status,
                                location: location || 'Location unavailable',
                                lastUpdate: new Date().toISOString()
                            };
                            
                            if (unitIndex >= 0) {
                                units[unitIndex] = unitData;
                            } else {
                                units.push(unitData);
                            }
                            
                            localStorage.setItem('emt-units', JSON.stringify(units));
                        }
                    );
                } else {
                    // Update without coordinates
                    const unitData = {
                        id: unitId,
                        name: currentUser.name || unitId,
                        status: status,
                        location: location || 'Location unavailable',
                        lastUpdate: new Date().toISOString()
                    };
                    
                    if (unitIndex >= 0) {
                        units[unitIndex] = unitData;
                    } else {
                        units.push(unitData);
                    }
                    
                    localStorage.setItem('emt-units', JSON.stringify(units));
                }
            } catch (error) {
                console.error('Error updating EMT unit:', error);
            }
        }
        
        // Report arrival
        function reportArrival() {
            const location = document.getElementById('locationInput').value.trim() || 'Current location';
            
            if (typeof ERIS !== 'undefined') {
                ERIS.publish('emt.reached', {
                    unit: unitId,
                    location: location
                });
                ERIS.toast(`Arrival reported at ${location}`);
            }
            
            addActivity(`Arrived at ${location}`);
            
            // Update status to on-scene
            document.getElementById('statusSelect').value = 'on-scene';
            updateStatus();
        }
        
        // Report departure
        function reportDeparture() {
            const location = document.getElementById('locationInput').value.trim() || 'Last location';
            
            if (typeof ERIS !== 'undefined') {
                ERIS.publish('emt.left', {
                    unit: unitId,
                    location: location
                });
                ERIS.toast(`Departure reported from ${location}`);
            }
            
            addActivity(`Departed from ${location}`);
            
            // Update status to available
            document.getElementById('statusSelect').value = 'available';
            updateStatus();
        }
        
        // Request backup
        function requestBackup() {
            const location = document.getElementById('locationInput').value.trim() || 'Current location';
            
            if (confirm(`Request backup at ${location}?`)) {
                addActivity(`Backup requested at ${location}`);
                
                if (typeof ERIS !== 'undefined') {
                    ERIS.toast('Backup request sent');
                } else {
                    alert('Backup request has been sent to dispatch');
                }
            }
        }
        
        // Add activity to list
        function addActivity(text) {
            const list = document.getElementById('activityList');
            const now = new Date();
            
            const item = document.createElement('div');
            item.className = 'activity-item';
            item.innerHTML = `
                <div class="activity-time">${now.toLocaleTimeString()}</div>
                <div class="activity-text">${text}</div>
            `;
            
            list.insertBefore(item, list.firstChild);
            
            // Keep only last 10 items
            while (list.children.length > 10) {
                list.removeChild(list.lastChild);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set initial status timestamp
            const now = new Date();
            document.getElementById('statusTimestamp').textContent = 
                `Last updated: ${now.toLocaleTimeString()}`;
            
            // Initialize EMT unit
            updateEMTUnit('available', '');
            
            addActivity('Logged in to EMT dashboard');
        });
    </script>
</body>
</html>
