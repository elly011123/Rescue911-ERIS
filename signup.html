<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ERIS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        .signup-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-2xl) var(--space-lg);
        }
        
        .signup-wrapper {
            width: 100%;
            max-width: 600px;
        }
        
        .signup-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: var(--space-2xl);
            box-shadow: var(--shadow-lg);
        }
        
        .signup-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }
        
        .signup-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--space-sm);
        }
        
        .signup-subtitle {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
        }
        
        .form-grid-full {
            grid-column: 1 / -1;
        }
        
        .form-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-md);
            margin-top: var(--space-xl);
        }
        
        .btn-secondary {
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
            border: 1.5px solid var(--color-border);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-secondary:hover {
            background: var(--color-bg-tertiary);
            border-color: var(--color-border-dark);
        }
        
        .success-message {
            background: #F0FFF4;
            border: 1px solid #9AE6B4;
            border-radius: var(--radius-md);
            padding: var(--space-md);
            color: var(--color-success);
            font-size: 0.9rem;
            margin-top: var(--space-md);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            animation: slideDown 0.3s ease;
        }
        
        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .form-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Login
    </a>
    
    <div class="signup-container">
        <div class="signup-wrapper">
            <div class="signup-card">
                <div class="signup-header">
                    <h1 class="signup-title">Create Employee Account</h1>
                    <p class="signup-subtitle">Register your credentials to access the ERIS system</p>
                </div>
                
                <form id="signupForm">
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="name" class="field-label">Full Name *</label>
                            <input 
                                type="text" 
                                id="name" 
                                class="field-input"
                                placeholder="Jane Doe"
                                required
                            >
                        </div>
                        
                        <div class="form-field">
                            <label for="employeeId" class="field-label">Employee ID *</label>
                            <input 
                                type="text" 
                                id="employeeId" 
                                class="field-input"
                                placeholder="OP1001"
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="username" class="field-label">Username *</label>
                            <input 
                                type="text" 
                                id="username" 
                                class="field-input"
                                placeholder="jdoe"
                                required
                                autocomplete="username"
                            >
                        </div>
                        
                        <div class="form-field">
                            <label for="role" class="field-label">Role *</label>
                            <div class="select-wrapper">
                                <select id="role" class="field-select" required>
                                    <option value="">Select role</option>
                                    <option value="operator">Call Operator</option>
                                    <option value="emt">EMT / Paramedic</option>
                                    <option value="manager">Manager / Supervisor</option>
                                </select>
                                <svg class="select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
                                    <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-field form-grid-full">
                        <label for="email" class="field-label">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="field-input"
                            placeholder="jane.doe@eris.com"
                            autocomplete="email"
                        >
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="password" class="field-label">Password *</label>
                            <input 
                                type="password" 
                                id="password" 
                                class="field-input"
                                placeholder="Min. 6 characters"
                                required
                                autocomplete="new-password"
                            >
                        </div>
                        
                        <div class="form-field">
                            <label for="confirm" class="field-label">Confirm Password *</label>
                            <input 
                                type="password" 
                                id="confirm" 
                                class="field-input"
                                placeholder="Re-enter password"
                                required
                                autocomplete="new-password"
                            >
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <span>Create Account</span>
                        </button>
                        <a href="index.html" class="btn-secondary">Cancel</a>
                    </div>
                    
                    <div id="msg"></div>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize default accounts
        function initializeDefaultAccounts() {
            const key = 'r911.accounts';
            const raw = localStorage.getItem(key);
            let accounts = raw ? JSON.parse(raw) : [];
            
            const defaultAccounts = [
                {
                    username: 'evan1315',
                    password: 'Op123!',
                    role: 'operator',
                    name: 'Evan Rodriguez',
                    email: 'evan.rodriguez@eris.com',
                    employeeId: 'OP1315'
                },
                {
                    username: 'emma1120',
                    password: 'Emt123!',
                    role: 'emt',
                    name: 'Emma Chen',
                    email: 'emma.chen@eris.com',
                    employeeId: 'EMT1120'
                },
                {
                    username: 'john8900',
                    password: 'Mg123!',
                    role: 'manager',
                    name: 'John Williams',
                    email: 'john.williams@eris.com',
                    employeeId: 'MG8900'
                }
            ];
            
            defaultAccounts.forEach(defaultAccount => {
                const exists = accounts.some(a => 
                    a.username && a.username.toLowerCase() === defaultAccount.username.toLowerCase()
                );
                if (!exists) {
                    accounts.push(defaultAccount);
                } else {
                    const index = accounts.findIndex(a => 
                        a.username && a.username.toLowerCase() === defaultAccount.username.toLowerCase()
                    );
                    if (index !== -1) {
                        accounts[index] = { ...accounts[index], ...defaultAccount };
                    }
                }
            });
            
            localStorage.setItem(key, JSON.stringify(accounts));
        }
        
        initializeDefaultAccounts();
        
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const employeeId = document.getElementById('employeeId').value.trim();
            const username = document.getElementById('username').value.trim();
            const role = document.getElementById('role').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const msg = document.getElementById('msg');
            
            function showMessage(text, isSuccess = true) {
                msg.className = isSuccess ? 'success-message' : 'error-message';
                msg.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        ${isSuccess 
                            ? '<polyline points="20 6 9 17 4 12"/>' 
                            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
                        }
                    </svg>
                    <span>${text}</span>
                `;
                msg.style.display = 'flex';
                setTimeout(() => { msg.style.display = 'none'; }, 4000);
            }
            
            if (!name || !employeeId || !username || !role || !password) {
                return showMessage('Please fill in all required fields', false);
            }
            
            if (password.length < 6) {
                return showMessage('Password must be at least 6 characters', false);
            }
            
            if (password !== confirm) {
                return showMessage('Passwords do not match', false);
            }
            
            try {
                const key = 'r911.accounts';
                const raw = localStorage.getItem(key);
                const accounts = raw ? JSON.parse(raw) : [];
                
                if (accounts.some(a => a.username.toLowerCase() === username.toLowerCase())) {
                    return showMessage('Username already exists', false);
                }
                
                accounts.push({ username, password, role, name, email, employeeId });
                localStorage.setItem(key, JSON.stringify(accounts));
                
                showMessage('Account created successfully! Redirecting to login...');
                setTimeout(() => location.href = 'index.html', 1500);
            } catch (error) {
                console.error(error);
                showMessage('Failed to create account. Please try again.', false);
            }
        });
    </script>
</body>
</html>
