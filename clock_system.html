<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Clock - ERIS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        .clock-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #F7FAFC 0%, #EDF2F7 100%);
            padding: var(--space-2xl) var(--space-lg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .clock-wrapper {
            width: 100%;
            max-width: 650px;
        }
        
        .clock-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: var(--space-2xl);
            box-shadow: var(--shadow-lg);
            margin-bottom: var(--space-lg);
        }
        
        .clock-header {
            text-align: center;
            margin-bottom: var(--space-2xl);
            padding-bottom: var(--space-xl);
            border-bottom: 1px solid var(--color-border);
        }
        
        .clock-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--space-sm);
        }
        
        .current-time {
            font-family: var(--font-mono);
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--space-sm);
            letter-spacing: -0.02em;
        }
        
        .current-date {
            font-size: 1rem;
            color: var(--color-text-secondary);
            font-weight: 500;
        }
        
        .status-panel {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            margin-bottom: var(--space-xl);
            text-align: center;
        }
        
        .status-label {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
            font-weight: 500;
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .status-value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .status-value.in {
            color: var(--color-success);
        }
        
        .status-value.out {
            color: var(--color-text-tertiary);
        }
        
        .clock-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }
        
        .clock-btn {
            padding: 1.125rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
        }
        
        .clock-btn-in {
            background: linear-gradient(135deg, var(--color-success) 0%, #2F855A 100%);
            color: white;
            box-shadow: 0 3px 12px rgba(47, 133, 90, 0.25);
        }
        
        .clock-btn-in:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(47, 133, 90, 0.35);
        }
        
        .clock-btn-out {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: white;
            box-shadow: 0 3px 12px rgba(197, 48, 48, 0.25);
        }
        
        .clock-btn-out:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 48, 48, 0.35);
        }
        
        .clock-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .records-section {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
        }
        
        .records-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--space-md);
        }
        
        .records-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            max-height: 320px;
            overflow-y: auto;
        }
        
        .record-item {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .record-time {
            font-size: 0.95rem;
            color: var(--color-text-primary);
            font-weight: 600;
        }
        
        .record-badge {
            padding: 0.375rem 0.875rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .record-badge.in {
            background: #C6F6D5;
            color: #22543D;
        }
        
        .record-badge.out {
            background: #FED7D7;
            color: #742A2A;
        }
        
        .notification {
            position: fixed;
            top: var(--space-xl);
            right: var(--space-xl);
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .notification.success {
            border-color: var(--color-success-light);
            background: #F0FFF4;
        }
        
        .notification.error {
            border-color: var(--color-primary-light);
            background: var(--color-primary-pale);
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @media (max-width: 640px) {
            .clock-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Home
    </a>
    
    <div class="clock-page">
        <div class="clock-wrapper">
            <div class="clock-card">
                <div class="clock-header">
                    <h1 class="clock-title">Time Clock System</h1>
                    <div class="current-time" id="currentTime">00:00:00</div>
                    <div class="current-date" id="currentDate">Loading...</div>
                </div>
                
                <div class="status-panel">
                    <div class="status-label">Current Status</div>
                    <div class="status-value out" id="statusValue">Clocked Out</div>
                </div>
                
                <div class="clock-actions">
                    <button class="clock-btn clock-btn-in" id="clockInBtn" onclick="clockIn()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        <span>Clock In</span>
                    </button>
                    <button class="clock-btn clock-btn-out" id="clockOutBtn" onclick="clockOut()" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                        <span>Clock Out</span>
                    </button>
                </div>
                
                <div class="records-section">
                    <h3 class="records-header">Today's Activity</h3>
                    <div class="records-list" id="recordsList">
                        <p style="color: var(--color-text-tertiary); text-align: center; padding: var(--space-lg);">No records yet today</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStatus = 'out';
        let employeeId = localStorage.getItem('username') || 'employee_001';
        
        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            loadTodayRecords();
            setInterval(updateClock, 1000);
        });
        
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}:${seconds}`;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);
        }
        
        async function loadTodayRecords() {
            try {
                const stored = localStorage.getItem(`clock-records-${employeeId}`);
                let allRecords = stored ? JSON.parse(stored) : [];
                
                const today = new Date().toDateString();
                const todayRecords = allRecords.filter(record => 
                    new Date(record.timestamp).toDateString() === today
                );
                
                if (todayRecords.length > 0) {
                    const lastRecord = todayRecords[todayRecords.length - 1];
                    currentStatus = lastRecord.type === 'in' ? 'in' : 'out';
                    updateStatusDisplay();
                }
                
                displayRecords(todayRecords);
            } catch (error) {
                console.error('Error loading records:', error);
            }
        }
        
        async function clockIn() {
            if (currentStatus === 'in') {
                showNotification('You are already clocked in', 'error');
                return;
            }
            
            const record = {
                id: Date.now().toString(),
                employeeId: employeeId,
                type: 'in',
                timestamp: new Date().toISOString()
            };
            
            await saveRecord(record);
            currentStatus = 'in';
            updateStatusDisplay();
            await loadTodayRecords();
            showNotification('Successfully clocked in', 'success');
        }
        
        async function clockOut() {
            if (currentStatus === 'out') {
                showNotification('You are already clocked out', 'error');
                return;
            }
            
            const record = {
                id: Date.now().toString(),
                employeeId: employeeId,
                type: 'out',
                timestamp: new Date().toISOString()
            };
            
            await saveRecord(record);
            currentStatus = 'out';
            updateStatusDisplay();
            await loadTodayRecords();
            showNotification('Successfully clocked out', 'success');
        }
        
        async function saveRecord(record) {
            try {
                const stored = localStorage.getItem(`clock-records-${employeeId}`);
                let records = stored ? JSON.parse(stored) : [];
                records.push(record);
                localStorage.setItem(`clock-records-${employeeId}`, JSON.stringify(records));
            } catch (error) {
                console.error('Error saving record:', error);
            }
        }
        
        function updateStatusDisplay() {
            const statusValue = document.getElementById('statusValue');
            const clockInBtn = document.getElementById('clockInBtn');
            const clockOutBtn = document.getElementById('clockOutBtn');
            
            if (currentStatus === 'in') {
                statusValue.textContent = 'Clocked In';
                statusValue.className = 'status-value in';
                clockInBtn.disabled = true;
                clockOutBtn.disabled = false;
            } else {
                statusValue.textContent = 'Clocked Out';
                statusValue.className = 'status-value out';
                clockInBtn.disabled = false;
                clockOutBtn.disabled = true;
            }
        }
        
        function displayRecords(records) {
            const recordsList = document.getElementById('recordsList');
            
            if (records.length === 0) {
                recordsList.innerHTML = '<p style="color: var(--color-text-tertiary); text-align: center; padding: var(--space-lg);">No records yet today</p>';
                return;
            }
            
            recordsList.innerHTML = records.map(record => {
                const time = new Date(record.timestamp);
                const timeStr = time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="record-item">
                        <span class="record-time">${timeStr}</span>
                        <span class="record-badge ${record.type}">${record.type === 'in' ? 'Clock In' : 'Clock Out'}</span>
                    </div>
                `;
            }).join('');
        }
        
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            
            const icon = type === 'success' 
                ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
                : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
            
            notification.innerHTML = `${icon}<span style="font-weight: 600;">${message}</span>`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
