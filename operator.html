<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Dashboard - ERIS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .dashboard {
            min-height: 100vh;
            background: var(--color-bg-secondary);
        }
        
        .dashboard-header {
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-lg) var(--space-xl);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }
        
        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 0.25rem;
        }
        
        .header-text p {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--color-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .user-details {
            display: flex;
            flex-direction: column;
        }
        
        .user-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }
        
        .user-role {
            font-size: 0.75rem;
            color: var(--color-text-tertiary);
        }
        
        .btn-logout {
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-logout:hover {
            background: var(--color-bg);
            color: var(--color-text-primary);
            border-color: var(--color-border-dark);
        }
        
        .dashboard-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: var(--space-xl);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
        }
        
        .stat-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-sm);
            font-weight: 500;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text-primary);
            font-family: var(--font-mono);
        }
        
        .stat-value.critical {
            color: var(--color-primary);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-xl);
            margin-bottom: var(--space-xl);
        }
        
        .card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-sm);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--color-border);
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text-primary);
        }
        
        .card-badge {
            padding: 0.375rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--color-primary-pale);
            color: var(--color-primary);
        }
        
        .call-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            max-height: 400px;
            overflow-y: auto;
        }
        
        .call-item {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-info);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            transition: all var(--transition-fast);
            cursor: pointer;
        }
        
        .call-item:hover {
            background: var(--color-bg-tertiary);
            border-left-color: var(--color-primary);
        }
        
        .call-item.emergency {
            border-left-color: var(--color-primary);
            background: var(--color-primary-pale);
        }
        
        .call-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--space-sm);
        }
        
        .call-time {
            font-size: 0.8rem;
            color: var(--color-text-tertiary);
            font-family: var(--font-mono);
        }
        
        .call-priority {
            padding: 0.25rem 0.625rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .priority-high {
            background: #FED7D7;
            color: #742A2A;
        }
        
        .priority-medium {
            background: #FEEBC8;
            color: #744210;
        }
        
        .call-location {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--space-xs);
        }
        
        .call-description {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }
        
        .map-container {
            grid-column: 1 / -1;
        }
        
        #emtMap {
            width: 100%;
            height: 450px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
        }
        
        .empty-state {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--color-text-tertiary);
        }
        
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: var(--space-md);
            opacity: 0.5;
        }
        
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .dashboard-content {
                padding: var(--space-md);
            }
            
            .header-content {
                flex-direction: column;
                gap: var(--space-md);
            }
            
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <div class="header-content">
                <div class="header-title">
                    <div class="header-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>Call Operator Dashboard</h1>
                        <p id="currentTime">Loading...</p>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">OP</div>
                        <div class="user-details">
                            <div class="user-name" id="userName">Operator</div>
                            <div class="user-role">Call Operator</div>
                        </div>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 4px;">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </header>
        
        <main class="dashboard-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Active Calls</div>
                    <div class="stat-value" id="activeCallsCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending</div>
                    <div class="stat-value" id="pendingCallsCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">High Priority</div>
                    <div class="stat-value critical" id="criticalCallsCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">EMTs Available</div>
                    <div class="stat-value" id="availableEmtsCount">0</div>
                </div>
            </div>
            
            <div class="main-grid">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Incoming Calls</h2>
                        <span class="card-badge" id="incomingBadge">0</span>
                    </div>
                    <div class="call-list" id="incomingCallsList">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                            <p>No incoming calls</p>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Active Dispatches</h2>
                        <span class="card-badge" id="activeBadge">0</span>
                    </div>
                    <div class="call-list" id="activeCallsList">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                            <p>No active dispatches</p>
                        </div>
                    </div>
                </div>
                
                <div class="card map-container">
                    <div class="card-header">
                        <h2 class="card-title">EMT Locations</h2>
                        <button class="btn-secondary" onclick="refreshMap()" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 4px;">
                                <polyline points="23 4 23 10 17 10"/>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                            </svg>
                            Refresh
                        </button>
                    </div>
                    <div id="emtMap"></div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // Update current time
        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        updateCurrentTime();
        setInterval(updateCurrentTime, 30000);
        
        // Load user info
        const currentUser = JSON.parse(localStorage.getItem('r911.currentUser') || '{}');
        if (currentUser.name) {
            document.getElementById('userName').textContent = currentUser.name;
            const initials = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase();
            document.getElementById('userAvatar').textContent = initials;
        }
        
        // Logout
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('r911.currentUser');
                localStorage.removeItem('username');
                window.location.href = 'index.html';
            }
        }
        
        // Listen for incoming calls
        window.addEventListener('storage', function(e) {
            if (e.key === 'incomingCall' && e.newValue) {
                try {
                    const call = JSON.parse(e.newValue);
                    addIncomingCall(call);
                } catch (err) {
                    console.error('Error parsing incoming call:', err);
                }
            }
        });
        
        // Add incoming call to list
        function addIncomingCall(call) {
            const list = document.getElementById('incomingCallsList');
            const emptyState = list.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const callItem = document.createElement('div');
            callItem.className = 'call-item emergency';
            callItem.innerHTML = `
                <div class="call-header">
                    <span class="call-time">${new Date(call.ts).toLocaleTimeString()}</span>
                    <span class="call-priority priority-high">High</span>
                </div>
                <div class="call-location">${call.address}${call.landmark ? ' • ' + call.landmark : ''}</div>
                <div class="call-description">${call.description}</div>
                <div style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--color-text-secondary);">
                    Patient: ${call.patientName}${call.phone ? ' • ' + call.phone : ''}
                </div>
            `;
            
            list.insertBefore(callItem, list.firstChild);
            
            // Update badge
            const badge = document.getElementById('incomingBadge');
            badge.textContent = list.children.length;
            
            // Update stats
            updateStats();
        }
        
        // Update statistics
        function updateStats() {
            const incomingCount = document.getElementById('incomingCallsList').children.length - 
                (document.getElementById('incomingCallsList').querySelector('.empty-state') ? 1 : 0);
            const activeCount = document.getElementById('activeCallsList').children.length -
                (document.getElementById('activeCallsList').querySelector('.empty-state') ? 1 : 0);
            
            document.getElementById('activeCallsCount').textContent = incomingCount + activeCount;
            document.getElementById('pendingCallsCount').textContent = incomingCount;
            document.getElementById('criticalCallsCount').textContent = incomingCount; // Simplified
        }
        
        // Initialize map
        let map, markers = {};
        
        function initMap() {
            if (typeof L === 'undefined') return;
            
            map = L.map('emtMap').setView([40.4237, -86.9212], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
            
            loadEMTLocations();
            setInterval(loadEMTLocations, 10000);
        }
        
        function loadEMTLocations() {
            try {
                const stored = localStorage.getItem('emt-units');
                const emts = stored ? JSON.parse(stored) : seedEMTs();
                
                // Clear old markers
                Object.values(markers).forEach(m => map.removeLayer(m));
                markers = {};
                
                emts.forEach(emt => {
                    if (emt.lat == null || emt.lng == null) return;
                    
                    const color = emt.status === 'available' ? '#10b981' :
                                  emt.status === 'on-scene' ? '#8b5cf6' :
                                  emt.status === 'transporting' ? '#3b82f6' : '#6b7280';
                    
                    const marker = L.circleMarker([emt.lat, emt.lng], {
                        radius: 8,
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.8
                    })
                    .addTo(map)
                    .bindPopup(`<strong>${emt.name || emt.id}</strong><br>Status: ${emt.status || 'Unknown'}`);
                    
                    markers[emt.id] = marker;
                });
                
                // Update available count
                const availableCount = emts.filter(e => e.status === 'available').length;
                document.getElementById('availableEmtsCount').textContent = availableCount;
            } catch (error) {
                console.error('Error loading EMT locations:', error);
            }
        }
        
        function seedEMTs() {
            const units = [
                { id: 'EMT-001', name: 'Unit Alpha', status: 'available', lat: 40.4237, lng: -86.9212 },
                { id: 'EMT-002', name: 'Unit Bravo', status: 'on-scene', lat: 40.4250, lng: -86.9150 },
                { id: 'EMT-003', name: 'Unit Charlie', status: 'available', lat: 40.4215, lng: -86.9302 }
            ];
            localStorage.setItem('emt-units', JSON.stringify(units));
            return units;
        }
        
        function refreshMap() {
            loadEMTLocations();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            updateStats();
            
            // Check for existing incoming call
            const storedCall = localStorage.getItem('incomingCall');
            if (storedCall) {
                try {
                    const call = JSON.parse(storedCall);
                    addIncomingCall(call);
                } catch (err) {
                    console.error('Error loading stored call:', err);
                }
            }
        });
    </script>
</body>
</html>
